<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FBEEDA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Recipy" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Recipy</title>
    <style>
      /* 100dvh suit le clavier virtuel (il rétrécit la mise en page au lieu de la laisser fixe
         sous le clavier) ; 100% reste en repli pour les navigateurs qui ne supportent pas dvh. */
      html, body, #root { height: 100%; height: 100dvh; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; }
      body { background: #FBEEDA; overflow: hidden; overscroll-behavior: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
